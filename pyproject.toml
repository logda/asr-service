[project]
name = "asr-service"
version = "1.0.0"
description = "FastAPI + FunASR 语音转写服务（提交-转写-查询全链路）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "funasr==1.3.1",
    # 与生产 GPU 镜像保持一致的 torch 版本（CUDA 轮子来自阿里 PyPI 镜像）
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

# 统一走阿里云 PyPI 镜像（uv 与 pip 共用此配置）
[[index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
